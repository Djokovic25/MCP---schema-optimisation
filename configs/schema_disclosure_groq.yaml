
experiment:
  name: schema_disclosure_groq

model:
  name: openai/gpt-oss-20b

schema:
  path: schemas/synthetic/search_issues_v2.json

tasks:
  path: tasks/schema_disclosure_tasks_v1.json

conditions:
  - name: full
  - name: relevant_only
  - name: relevant_plus_one_irrelevant
  - name: minimal_relevant

execution:
  repetitions: 3
  delay_seconds: 5
  max_calls: 180
  max_tasks: 15
  max_conditions: 4

output:
  directory: results/schema_disclosure_groq
